[pytest]
# Markers, declared so a typo in a decorator is an error rather than a test
# that silently never runs.
#
#   slow — talks to the LIVE control plane and/or data plane, creates and
#          deletes real accounts, and takes minutes. The release gate runs
#          these deliberately; `-m "not slow"` is the offline suite.
markers =
    slow: live end-to-end against production planes; minutes, not seconds
